name: Build and Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version, for example v0.1.0"
        required: true
        default: "v0.1.0"

permissions:
  contents: write

jobs:
  release:
    name: Build ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux deb
            platform: ubuntu-22.04
            args: --bundles deb
          - name: macOS dmg
            platform: macos-latest
            args: --bundles dmg
          - name: Windows exe
            platform: windows-latest
            args: --bundles nsis

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve release version
        id: release_version
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            RELEASE_VERSION="${{ inputs.version }}"
          elif [[ "${{ github.ref_type }}" == "tag" ]]; then
            RELEASE_VERSION="${{ github.ref_name }}"
          else
            RELEASE_VERSION="v0.0.0-nightly.${{ github.run_number }}"
          fi
          echo "value=$RELEASE_VERSION" >> "$GITHUB_OUTPUT"

      - name: Show release context
        shell: bash
        run: |
          echo "event_name=${{ github.event_name }}"
          echo "ref=${{ github.ref }}"
          echo "ref_name=${{ github.ref_name }}"
          echo "input_version=${{ inputs.version }}"
          echo "resolved_release_version=${{ steps.release_version.outputs.value }}"

      - name: Validate release version format
        shell: bash
        run: |
          RELEASE_VERSION="${{ steps.release_version.outputs.value }}"
          if [[ ! "$RELEASE_VERSION" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z]+)*$ ]]; then
            echo "Invalid release version: $RELEASE_VERSION"
            echo "Expected format: vMAJOR.MINOR.PATCH (example: v0.1.0)"
            exit 1
          fi
          echo "Release version format is valid: $RELEASE_VERSION"

      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libglib2.0-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            pkg-config

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      - name: Install Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Test frontend
        run: bun run test

      - name: Build and upload release bundles
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: .
          args: ${{ matrix.args }}
          tagName: ${{ steps.release_version.outputs.value }}
          releaseName: "SwiftShare ${{ steps.release_version.outputs.value }}"
          releaseBody: |
            # SwiftShare ${{ steps.release_version.outputs.value }}

            SwiftShare is an open-source local Wi-Fi file sharing desktop app for Windows, macOS, and Linux.

            ## Downloads

            The installers are attached to this release:

            - Windows: download the `.exe` installer.
            - macOS: download the `.dmg` image.
            - Linux: download the `.deb` package.

            ## Notes

            - No internet or central server is required for transfers.
            - Devices must be on the same local network.
            - Repository: https://github.com/mozaddedalfeshani/swiftshare
          releaseDraft: false
          prerelease: false
